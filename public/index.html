<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2050">
<title>色塊人城市</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">■</span>色塊人城市</div>
  <div class="where" id="where">載入中</div>
  <div class="top-actions">
    <span class="net-dot" id="netDot" title="連線狀態"></span>
    <button class="ghost-btn hidden" id="editBtn" title="修改角色">🎨 <span class="lbl">修改角色</span></button>
    <button class="ghost-btn" id="qualityBtn" title="畫質">✨ <span class="lbl" id="qualityLbl">畫質：高</span></button>
  </div>
</header>

<main>
  <!-- ===== 載入中 ===== -->
  <section class="screen" id="scrBoot">
    <div class="boot">
      <div class="boot-logo"><span></span><span></span><span></span></div>
      <p id="bootText">正在連線到色塊人城市…</p>
    </div>
  </section>

  <!-- ===== 角色建立 ===== -->
  <section class="screen hidden" id="scrCreator">
    <div class="creator">
      <div class="creator-preview">
        <h2 id="creatorTitle">建立你的色塊人</h2>
        <div class="preview-box">
          <canvas id="previewCanvas"></canvas>
          <div class="preview-ctrl">
            <button class="round-btn" id="rotL" aria-label="向左轉">⟲</button>
            <button class="chip" id="walkToggle">🚶 走路預覽</button>
            <button class="round-btn" id="rotR" aria-label="向右轉">⟳</button>
          </div>
        </div>
      </div>
      <div class="creator-form">
        <label class="field"><span>暱稱 <small>（1～10 個字）</small></span>
          <input type="text" id="nameInput" maxlength="10" placeholder="輸入你的暱稱" autocomplete="off"></label>
        <div class="field"><span>身體主色</span><div class="swatches" id="swBody"></div></div>
        <div class="field"><span>配色 <small>（腳、帽子、條紋）</small></span><div class="swatches" id="swAccent"></div></div>
        <div class="field two">
          <div><span>膚色</span><div class="swatches" id="swSkin"></div></div>
          <div><span>髮色</span><div class="swatches" id="swHair"></div></div>
        </div>
        <div class="field"><span>表情</span><div class="chips" id="chExpr"></div></div>
        <div class="field"><span>帽子</span><div class="chips" id="chHat"></div></div>
        <div class="field"><span>眼鏡</span><div class="chips" id="chGlasses"></div></div>
        <p class="form-error" id="creatorError"></p>
        <div class="creator-actions">
          <button class="btn" id="randomBtn">🎲 隨機</button>
          <button class="btn hidden" id="cancelEditBtn">取消</button>
          <button class="btn primary big" id="enterBtn">進入城市 ▶</button>
        </div>
        <p class="hint">角色會保存在這台裝置上，下次進來可以直接沿用，也能在城市裡隨時修改。</p>
      </div>
    </div>
  </section>

  <!-- ===== 城市 ===== -->
  <section class="screen hidden" id="scrCity">
    <div class="city-stage">
      <canvas id="cityCanvas"></canvas>
      <div class="city-tip" id="cityTip"><b>WASD / 方向鍵</b> 移動　<b>Enter</b> 聊天　走進發光的門口就能進入建築</div>
      <div class="near-tip hidden" id="nearTip"></div>
      <div class="joy" id="joy" aria-label="虛擬搖桿"><div class="knob" id="joyKnob"></div></div>
      <div class="city-chat" id="cityChat">
        <div class="mini-log" id="cityLog"></div>
        <form class="chat-row" id="cityForm" autocomplete="off">
          <input type="text" id="cityInput" maxlength="60" placeholder="按 Enter 說話（城市聊天）">
          <button class="btn small" type="submit">送出</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ===== 誰是臥底：大廳 ===== -->
  <section class="screen hidden" id="scrLobby">
    <div class="lobby">
      <canvas id="lobbyCanvas"></canvas>
      <div class="lobby-panel">
        <div class="lobby-head">
          <h2>🔍 誰是臥底 <small>遊戲大廳</small></h2>
          <button class="link-btn" id="lobbyRules">📖 規則說明</button>
        </div>
        <div class="lobby-tabs" role="tablist">
          <button class="tab" data-tab="create">🏠<b>建立房間</b></button>
          <button class="tab" data-tab="list">📋<b>瀏覽公開房間</b></button>
          <button class="tab" data-tab="random">🎲<b>隨機加入</b></button>
          <button class="tab" data-tab="code">🔑<b>輸入房間代碼</b></button>
        </div>
        <div class="lobby-body" id="lobbyBody"></div>
        <div class="lobby-foot"><button class="btn" id="lobbyExit">← 走出建築，回到城市</button></div>
      </div>
    </div>
  </section>

  <!-- ===== 誰是臥底：房間 ===== -->
  <section class="screen hidden" id="scrRoom">
    <div class="room">
      <div class="room-main">
        <div class="room-top">
          <div class="room-title"><b id="rName"></b><span class="code-chip" id="rCode" title="點一下複製房間代碼"></span><span class="tag lock hidden" id="rLock">🔒<span class="lbl"> 密碼房</span></span></div>
          <div class="room-phase"><span id="rPhase"></span><span class="round" id="rRound"></span></div>
          <div class="timer hidden" id="rTimer"><b>0</b></div>
          <div class="room-btns"><button class="ghost-btn dark" id="rRules">📖 <span class="lbl">規則</span></button><button class="ghost-btn dark hidden" id="rSettingsBtn">⚙️ <span class="lbl">設定</span></button><button class="side-toggle" id="rSideToggle">💬 紀錄<span class="dot hidden" id="rSideDot"></span></button></div>
        </div>
        <div class="room-stage">
          <canvas id="roomCanvas"></canvas>
          <div class="stage-banner hidden" id="rBanner"></div>
        </div>
        <div class="action" id="rAction"></div>
      </div>
      <aside class="room-side" id="rSide">
        <div class="side-head">
          <div class="log-tabs" id="logTabs">
            <button class="on" data-f="all">全部</button><button data-f="desc">描述</button><button data-f="sys">系統</button>
          </div>
          <button class="side-close" id="rSideClose" aria-label="收合">✕</button>
        </div>
        <div class="log" id="rLog"></div>
        <button class="new-pill hidden" id="rNewPill">⬇ 有新訊息</button>
        <form class="chat-row" id="rChatForm" autocomplete="off">
          <span class="chan" id="rChan">聊天</span>
          <input type="text" id="rChatInput" maxlength="60" placeholder="輸入訊息">
          <button class="btn small" type="submit">送出</button>
        </form>
        <p class="chat-hint" id="rChatHint"></p>
      </aside>
    </div>
    <div class="result hidden" id="rResult"></div>
  </section>
</main>

<div class="banner hidden" id="netBanner"></div>
<div id="fade"></div>
<div id="toast"></div>
<div class="modal hidden" id="modal"><div class="modal-card"><button class="modal-x" id="modalX" aria-label="關閉">✕</button><div id="modalBody"></div></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/shared/move.js"></script>
<script src="js/shared/citymap.js"></script>
<script src="js/shared/uc-rules.js"></script>
<script src="js/iso.js"></script>
<script src="js/avatar.js"></script>
<script src="js/props.js"></script>
<script src="js/bubbles.js"></script>
<script src="js/city.js"></script>
<script src="js/roomscene.js"></script>
<script src="js/ui-common.js"></script>
<script src="js/ui-lobby.js"></script>
<script src="js/ui-room.js"></script>
<script src="js/app.js"></script>
</body>
</html>
